<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body class="back-login">
    <div align="center">
        <div class="content" align="left">
            <!-- titulo primario  -->
            <h1 class="title-login" style="margin-top: 11vh;">Login!</h1>
            <!-- paragrafo 1  -->
            <p class="paragrafo-1" style="margin-top: -2vh;">Preencha seus dados para começar.</p>
            <!-- campo de inputs  -->
            <input type="email" placeholder="Email" class="input-email" style="margin-top: 5vh;"><br>
            <input type="password" placeholder="Senha" class="input-senha top3">
            <!-- paragrafo 2  -->
            <p class="paragrafo-2">Esqueceu sua senha?</p>
            <!-- botão  -->
            <button class="btn-login" style="margin-top: 4vh;">Login</button>
            <!-- paragrafo 3 s -->
            <p class="paragrafo-3" style="margin-top: 5vh;">Não tenho uma conta,<strong><u>Criar uma conta</u><strong>
            </p>
            <p class="paragrafo-4" style="margin-top: 23vh;">Ao fazer login, concordo com os <br><b><u>Termos de
                        uso</u><b> e <b><u>política deprivacidade.</u><b></b></p>
        </div>
    </div>
</body>

</html>
